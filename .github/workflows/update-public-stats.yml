name: Update public global stats

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. Run at minute 17 every hour to avoid the top-of-hour queue peak.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: update-public-global-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update Firestore public summary
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: npm run update-stats
