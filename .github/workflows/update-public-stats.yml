name: Update public global stats

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. Run at minute 17 every hour.
    - cron: '17 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: update-public-global-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: project-44be44c7-5433-4079-aaa
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config get registry

      - name: Install dependencies
        env:
          NPM_CONFIG_FETCH_RETRIES: '2'
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '5000'
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '20000'
          NPM_CONFIG_FETCH_TIMEOUT: '60000'
        run: npm ci --no-audit --no-fund --prefer-online

      - name: Update Firestore public summary
        run: npm run update-stats
